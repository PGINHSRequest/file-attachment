<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Document Requirements Search</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0d47a1,#1976d2,#ffd54f);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:800px;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#0d47a1;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:15px;
    font-size:16px;
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f4f8ff;
}

.doc-title{
    color:#0d47a1;
    font-weight:bold;
    font-size:18px;
}

ul{
    margin-top:8px;
}

li{
    margin:4px 0;
}

.note{
    margin-top:20px;
    font-size:13px;
    color:gray;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

<h1>Registrar Document Requirements</h1>

<a href="https://pginhsrequest.wordpress.com/" class="home-btn">
    ← Go Back to Home
</a>

<input 
id="search" 
placeholder="Type a document name (ex. TOR, Diploma, Form 137...)"
onkeyup="searchDocs()"
>

<div id="results"></div>

<div class="note">
Additional documents may be required depending on the request.
</div>

</div>

<script>

const documents = [

{
name:"Certificate of English as Medium of Instruction",
req:["School ID","Completed request form"]
},

{
name:"Certificate of Enrollment",
req:["School ID","Completed request form"]
},

{
name:"Certificate of General Weighted Average (GWA)",
req:["School ID","Completed request form","Clearance (if required)"]
},

{
name:"Certificate of Graduation",
req:["School ID","Completed request form"]
},

{
name:"Certificate of Grades",
req:["School ID","Completed request form"]
},

{
name:"Certificate of Honors",
req:["School ID","Completed request form"]
},

{
name:"Certificate of No Pending Case",
req:["School ID","Completed request form","Clearance"]
},

{
name:"Certificate of Ranking",
req:["School ID","Completed request form"]
},

{
name:"Certificate of Units Earned",
req:["School ID","Completed request form"]
},

{
name:"Certified True Copy of Diploma",
req:["School ID","Completed request form","Affidavit of Loss (if the original diploma is lost)"]
},

{
name:"Certified True Copy of Records",
req:["School ID","Completed request form"]
},

{
name:"Course Description",
req:["School ID","Completed request form"]
},

{
name:"Diploma",
req:["School ID","Completed request form","Affidavit of Loss (for replacement requests)"]
},

{
name:"Expected Date of Graduation",
req:["School ID","Completed request form"]
},

{
name:"Form 137 / Permanent Record (SF10)",
req:["School ID","Completed request form","Request letter from the receiving school (for transfer students)"]
},

{
name:"Form 138 / Report Card",
req:["School ID","Completed request form","Affidavit of Loss (if the original is unavailable)"]
},

{
name:"Grading System Certification",
req:["School ID","Completed request form"]
},

{
name:"Honorable Dismissal / Transfer Credentials",
req:["School ID","Completed request form","School clearance"]
},

{
name:"Letter of Recommendation",
req:["School ID","Completed request form"]
},

{
name:"Permit to Transfer",
req:["School ID","Completed request form","Clearance"]
},

{
name:"Transcript of Records (TOR)",
req:["School ID","Completed request form","Clearance","Proof of payment (if applicable)"]
},

{
name:"Verification / Authentication (CAV)",
req:["Original document","School ID","Completed request form"]
},

{
name:"Others",
req:["School ID","Completed request form"]
}

];

function searchDocs(){

let keyword = document.getElementById("search").value.toLowerCase();
let resultsDiv = document.getElementById("results");

resultsDiv.innerHTML="";

let filtered = documents.filter(doc =>
    doc.name.toLowerCase().includes(keyword)
);

if(filtered.length === 0){
    resultsDiv.innerHTML="<p>No document found.</p>";
    return;
}

filtered.forEach(doc=>{

let reqList = "";

doc.req.forEach(r=>{
    reqList += `<li>${r}</li>`;
});

resultsDiv.innerHTML += `
<div class="result">
<div class="doc-title">${doc.name}</div>
<ul>${reqList}</ul>
</div>
`;

});

}

</script>

</body>
</html>
