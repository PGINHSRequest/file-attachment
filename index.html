<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Document Requirements Search</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#0a1f44; /* Dark blue background (matches form page) */
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    margin:0;
}

/* Main container */
.container{
    background:linear-gradient(135deg,#FFF8B5,#B3D9FF); /* Pastel yellow + blue */
    width:800px;
    max-width:95%;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    color:#0a1f44;
}

/* Title */
h1{
    text-align:center;
    font-family:'Segoe UI',Arial,sans-serif;
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

/* Search input */
input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #0a1f44;
    margin-top:10px;
    font-size:16px;
    background:rgba(255,255,255,0.9);
    color:#0a1f44;
}

/* Result card */
.result{
    margin-top:20px;
    padding:18px;
    border-radius:15px;
    background:rgba(255,255,255,0.85);
    border:1px solid #0a1f44;
}

/* Document title */
.doc-title{
    color:#0a1f44;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

ul{
    margin-top:5px;
}

li{
    margin:4px 0;
}

/* Note text */
.note{
    margin-top:25px;
    font-size:13px;
    color:#0a1f44;
    text-align:center;
}

/* Home button */
.home-btn {
    display:block;
    text-align:center;
    padding:14px;
    margin-bottom:20px;
    background:linear-gradient(45deg,#FFA500,#FFD700);
    color:#0a1f44;
    font-weight:bold;
    text-decoration:none;
    border-radius:12px;
    transition:all .25s ease;
}
.home-btn:hover {
    background:linear-gradient(45deg,#FFD700,#FFA500);
}
</style>
</head>

<body>

<div class="container">

    <h1>Registrar Document Requirements</h1>

    <a href="https://pginhsrequest.wordpress.com/" class="home-btn">
        ← Go Back to Home
    </a>

    <input id="search" placeholder="Type a document name (ex. TOR, Diploma, Form 137...)" onkeyup="searchDocs()">

    <div id="results"></div>

    <div class="note">
        Additional documents may be required depending on the request.
    </div>

</div>

<script>
const documents = [
    { name:"Certificate of Enrollment", req:["School ID","Completed request form"] },
    { name:"Certificate of General Weighted Average (GWA)", req:["School ID","Completed request form","Clearance (if required)"] },
    { name:"Certificate of Graduation", req:["School ID","Completed request form"] },
    { name:"Certificate of Grades", req:["School ID","Completed request form"] },
    { name:"Certificate of Honors", req:["School ID","Completed request form"] },
    { name:"Certificate of Ranking", req:["School ID","Completed request form"] },
    { name:"Diploma", req:["School ID","Completed request form","Affidavit of Loss (for replacement)"] },
    { name:"Form 137 / Permanent Record (SF10)", req:["School ID","Completed request form","Request letter from receiving school"] },
    { name:"Form 138 / Report Card", req:["School ID","Completed request form","Affidavit of Loss (if unavailable)"] },
    { name:"Grading System Certification", req:["School ID","Completed request form"] },
    { name:"Honorable Dismissal / Transfer Credentials", req:["School ID","Completed request form","School clearance"] },
    { name:"Letter of Recommendation", req:["School ID","Completed request form"] },
    { name:"Permit to Transfer", req:["School ID","Completed request form","Clearance"] },
    { name:"Transcript of Records (TOR)", req:["School ID","Completed request form","Clearance","Proof of payment (if applicable)"] },
    { name:"Verification / Authentication (CAV)", req:["Original document","School ID","Completed request form"] },
    { name:"Others", req:["School ID","Completed request form"] }
];

function searchDocs(){
    let keyword = document.getElementById("search").value.toLowerCase();
    let resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML="";
    let filtered = documents.filter(doc => doc.name.toLowerCase().includes(keyword));
    
    if(filtered.length === 0){
        resultsDiv.innerHTML="<p>No document found.</p>";
        return;
    }

    filtered.forEach(doc=>{
        let reqList = "";
        doc.req.forEach(r=>{
            reqList += `<li>${r}</li>`;
        });

        resultsDiv.innerHTML += `
        <div class="result">
            <div class="doc-title">${doc.name}</div>
            <ul>${reqList}</ul>
        </div>`;
    });
}
</script>

</body>
</html>
